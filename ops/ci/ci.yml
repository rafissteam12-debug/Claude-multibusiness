# Ablaufwerk CI. Source of truth: ops/ci/ci.yml (ops agent). The orchestrator copies it to
# .github/workflows/ci.yml. Nothing here deploys, publishes or pushes images (CLAUDE.md rule 2).
# Actions are pinned to exact release tags; switch to full commit SHAs when the orchestrator
# can look them up (see docs/requests/ops.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  APP_ENV: test
  AI_PROVIDER: heuristic
  MAILER: console

jobs:
  test:
    name: unit tests + site build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests (everything except network)
        run: python -m pytest -m "not network"
      - name: Build site (staging mode, as Cloudflare does)
        run: python site/build.py
      - name: Site check - no prices, placeholders on legal pages, staging headers
        run: python ops/scripts/check_site.py --mode staging
      - name: Go-live readiness (informational, expected to fail until the business ID stage)
        continue-on-error: true
        run: python ops/scripts/check_site.py --mode release
      - name: Pins file is well-formed
        run: python ops/scripts/fetch_tools.py --dest "$RUNNER_TEMP/unused" --check-pins

  validators:
    name: KoSIT + Mustang (real tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Java version (runner default JDK)
        run: java -version
      - name: Download pinned tools and verify SHA-256 (ops/pins.txt)
        # Sets KOSIT_VALIDATOR_JAR, KOSIT_CONFIG_DIR, MUSTANG_JAR for the following steps.
        # A pin of "-" prints PIN-ON-FIRST-RUN <name> <sha256>: copy it into ops/pins.txt.
        run: python ops/scripts/fetch_tools.py --dest "$RUNNER_TEMP/tools" --env-file "$GITHUB_ENV"
      - name: Check out the official XRechnung test suite (release v2026-08-31)
        run: |
          git clone --depth 1 --branch v2026-08-31 \
            https://github.com/itplr-kosit/xrechnung-testsuite.git "$RUNNER_TEMP/xrechnung-testsuite"
          git -C "$RUNNER_TEMP/xrechnung-testsuite" log -1 --format='testsuite commit %H'
          # engine/tests/test_engine_kosit_suite.py reads this fixed path (until it reads an env var,
          # see docs/requests/ops.md):
          sudo mkdir -p /home/claude/itplr-kosit
          sudo ln -sfn "$RUNNER_TEMP/xrechnung-testsuite" /home/claude/itplr-kosit/xrechnung-testsuite
      - name: Engine tests with the tools installed
        run: python -m pytest engine/tests -m "not network"
      - name: Test suite - KoSIT vs our 3 layers
        run: |
          python ops/scripts/validate_testsuite.py \
            --suite "$RUNNER_TEMP/xrechnung-testsuite/src/test" --json "$RUNNER_TEMP/suite-report.json"
      - name: ZUGFeRD via Mustang (engine request 6)
        run: python ops/scripts/check_mustang.py --out "$RUNNER_TEMP/zugferd"
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: validator-reports
          path: |
            ${{ runner.temp }}/suite-report.json
            ${{ runner.temp }}/zugferd/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image + Caddyfile (build only, never pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build image (downloads and verifies the pinned tools)
        run: DOCKER_BUILDKIT=1 docker build -f ops/Dockerfile -t ablaufwerk-app:ci .
      - name: Base image digest (pin it in ops/Dockerfile)
        run: docker image inspect python:3.12-slim-trixie --format '{{json .RepoDigests}}' || true
      - name: Tools inside the image
        run: |
          docker run --rm --entrypoint sh ablaufwerk-app:ci -c '
            set -e
            java -version
            test -f "$KOSIT_VALIDATOR_JAR" && test -f "$KOSIT_CONFIG_DIR/scenarios.xml" && test -f "$MUSTANG_JAR"
            id -u | grep -vx 0
            python -c "import engine, mapping, contracts; print(\"imports ok\")"'
      - name: App starts and /healthz answers (needs app agent's /healthz)
        continue-on-error: true  # make blocking once app/ ships /healthz (docs/requests/ops.md)
        run: |
          docker run -d --name app -e APP_ENV=staging -e SESSION_SECRET=ci-only-not-secret \
            -p 127.0.0.1:8000:8000 ablaufwerk-app:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - name: Validate Caddyfile (placeholder domain replaced for the check only)
        run: |
          sed 's/\[\[BUSINESS_ID_PENDING_DOMAIN\]\]/app.example.invalid/' ops/Caddyfile > "$RUNNER_TEMP/Caddyfile"
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose file is valid
        run: |
          touch .env  # compose needs the env_file to exist; empty in CI
          docker compose -f ops/docker-compose.yml config --quiet

  network:
    name: network tests (only with ANTHROPIC_API_KEY secret)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets are not available to PRs from forks; the step below then skips.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Secret present?
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "ANTHROPIC_API_KEY not set - network tests skipped"; fi
      - uses: actions/checkout@v4.2.2
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5.3.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pip install -r requirements.txt
      - name: Network tests (the key is read from env by the code; never echoed)
        if: steps.key.outputs.present == 'true'
        env:
          AI_PROVIDER: anthropic
        run: python -m pytest -m network
