# Host journald drop-in for the Belegbruecke server (owner decision: logs kept 14 days).
# NOT active until the owner installs it at server setup (ops/RUNBOOK.md "Log retention: 14 days"):
#   sudo install -m 0644 -D ops/host/journald-belegbruecke.conf /etc/systemd/journald.conf.d/belegbruecke.conf
#   sudo systemctl restart systemd-journald
# Applies to the whole host journal: the containers (compose logging driver journald) and SSH/system logs.
# journald deletes whole journal files once their newest entry is older than MaxRetentionSec; MaxFileSec=1day
# starts a new file every day, so an entry outlives 14 days by at most about one file span.
# Reference: https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
