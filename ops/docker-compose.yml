# Production-style stack for the later EU VPS (owner approval needed before first use, see ops/RUNBOOK.md).
#   docker compose --env-file .env -f ops/docker-compose.yml up -d --build   (from the repository root)
# Paths are relative to this file (ops/). Secrets come from ../.env on the server (chmod 600, never in git).
name: ablaufwerk

# Container stdout/stderr of every service goes to the host journal (owner decision: 14 days). The age limit is
# set on the host by ops/host/journald-belegbruecke.conf (MaxRetentionSec=14day, MaxFileSec=1day); it is NOT
# active until the owner installs it at server setup (ops/RUNBOOK.md "Log retention: 14 days"). json-file and
# `local` can only rotate by size, never by age, so they cannot enforce 14 days.
x-logging: &logging
  driver: journald
  options:
    tag: "ablaufwerk-{{.Name}}"

x-app-common: &app-common
  image: ablaufwerk-app:local
  env_file: ../.env
  environment:
    DATABASE_PATH: /data/app.db
    TEMP_DIR: /data/tmp
  volumes:
    - appdata:/data
  read_only: true
  tmpfs:
    - /tmp:size=512m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging: *logging

services:
  app:
    <<: *app-common
    build:
      context: ..
      dockerfile: ops/Dockerfile
    environment:
      DATABASE_PATH: /data/app.db
      TEMP_DIR: /data/tmp
      # Port 8000 is not published. uvicorn trusts X-Forwarded-For only from caddy's fixed address.
      FORWARDED_ALLOW_IPS: "172.30.53.2"
    expose: ["8000"]
    networks: [edge]

  purge:
    <<: *app-common
    command: ["/opt/ops/purge.sh"]
    networks: [edge]
    pull_policy: never
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # Strict 14-day retention of the Caddy access log (ops/scripts/log_retention.py): daily copy-truncate rotation
  # into access-day-YYYY-MM-DD.log, deletes lines/files older than 14 days. Runs once at start, then 00:05 UTC.
  # Separate from `purge` on purpose: it sees only the log volume (no app data, no .env secrets, no network).
  # root inside the container because Caddy (root) owns the log files; no capabilities, read-only rootfs.
  logretention:
    image: ablaufwerk-app:local
    pull_policy: never
    command: ["python", "/opt/ops/log_retention.py", "--dir", "/var/log/caddy", "--days", "14", "--at", "00:05"]
    user: "0:0"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - caddy_logs:/var/log/caddy
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Only the domain is passed to caddy (not the whole .env with secrets). Compose reads it from the
    # file given with --env-file (see ops/RUNBOOK.md); unset -> Caddy refuses to start.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    networks:
      edge:
        ipv4_address: 172.30.53.2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

networks:
  # Fixed subnet so the app can trust forwarded headers from caddy's address only. Change both values
  # (here and FORWARDED_ALLOW_IPS) if the subnet collides with one on the server.
  edge:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  appdata:
  caddy_data:
  caddy_config:
  caddy_logs:
