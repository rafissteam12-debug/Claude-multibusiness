<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Folie 4: Ausnahmen, die immer als Papier oder PDF gehen dürfen: Kleinbetragsrechnungen bis 250 Euro, Fahrausweise, Rechnungen von Kleinunternehmern.">
<rect width="1080" height="1350" fill="#F7F5F0"/>
<rect x="0" y="0" width="1080" height="14" fill="#0F4C5C"/>
<rect x="72" y="80" width="260" height="60" rx="30" fill="#0F4C5C"/>
<text x="202" y="120" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">KI-generiert</text>
<text x="1008" y="120" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F" text-anchor="end">Pflicht &amp; Frist · 4/6</text>
<text x="72" y="270" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#B4410B">AUSNAHMEN</text>
<text x="72" y="382" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#0F4C5C">Dürfen immer Papier oder</text>
<text x="72" y="464" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#0F4C5C">PDF sein:</text>
<rect x="72" y="529" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="551" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Kleinbetragsrechnungen bis 250 € (§ 33 UStDV)</text>
<rect x="72" y="594" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="616" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Fahrausweise (§ 34 UStDV)</text>
<rect x="72" y="659" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="682" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Rechnungen von Kleinunternehmern (§ 34a</text>
<text x="120" y="733" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">UStDV)</text>
<text x="72" y="811" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="38" fill="#33453F">E-Rechnung ist da trotzdem erlaubt – nur nicht</text>
<text x="72" y="865" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="38" fill="#33453F">Pflicht.</text>
<text x="72" y="1100" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="24" fill="#55635F">Quelle: §§ 33, 34, 34a UStDV – gesetze-im-internet.de/ustdv_1980/</text>
<line x1="72" y1="1150" x2="1008" y2="1150" stroke="#DAD6CC" stroke-width="2"/>
<text x="72" y="1215" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#17262B">Ada · Ablaufwerk</text>
<text x="72" y="1260" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F">Keine Steuer- oder Rechtsberatung.</text>
<text x="1008" y="1215" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F" text-anchor="end">KI-generierte Figur</text>
</svg>
