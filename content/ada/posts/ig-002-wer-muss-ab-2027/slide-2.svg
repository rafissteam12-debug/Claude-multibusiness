<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Folie 2: Die Pflicht gilt für Rechnungen an andere Unternehmen, wenn beide in Deutschland sitzen. Rechnungen an Privatleute sind nicht betroffen.">
<rect width="1080" height="1350" fill="#F7F5F0"/>
<rect x="0" y="0" width="1080" height="14" fill="#0F4C5C"/>
<rect x="72" y="80" width="260" height="60" rx="30" fill="#0F4C5C"/>
<text x="202" y="120" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle">KI-generiert</text>
<text x="1008" y="120" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F" text-anchor="end">Pflicht &amp; Frist · 2/6</text>
<text x="72" y="270" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="40" font-weight="600" fill="#B4410B">WEN ES BETRIFFT</text>
<text x="72" y="391" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="80" font-weight="700" fill="#0F4C5C">Es geht um B2B im</text>
<text x="72" y="482" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="80" font-weight="700" fill="#0F4C5C">Inland.</text>
<rect x="72" y="547" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="570" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Rechnung an ein anderes Unternehmen</text>
<rect x="72" y="612" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="635" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Beide sitzen in Deutschland</text>
<rect x="72" y="677" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="700" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Rechnungen an Privatleute: nicht betroffen</text>
<rect x="72" y="743" width="16" height="16" rx="3" fill="#0F4C5C"/>
<text x="120" y="765" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">Viele steuerfreie Umsätze (§ 4 Nr. 8–29 UStG):</text>
<text x="120" y="816" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="36" fill="#33453F">nicht betroffen</text>
<text x="72" y="1100" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="24" fill="#55635F">Quelle: § 14 Abs. 2 UStG; BMF-Schreiben vom 15.10.2024, Rn. 1, 8, 12–13</text>
<line x1="72" y1="1150" x2="1008" y2="1150" stroke="#DAD6CC" stroke-width="2"/>
<text x="72" y="1215" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#17262B">Ada · Ablaufwerk</text>
<text x="72" y="1260" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F">Keine Steuer- oder Rechtsberatung.</text>
<text x="1008" y="1215" font-family="IBM Plex Sans, Inter, Arial, sans-serif" font-size="26" fill="#55635F" text-anchor="end">KI-generierte Figur</text>
